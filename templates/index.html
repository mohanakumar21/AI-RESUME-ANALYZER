<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>🤖 AI Resume Analyzer</h1>

        <p class="subtitle">
            Upload your resume and receive an ATS score, personalized feedback, and AI-powered improvement suggestions in seconds.
        </p>

        <div class="features">
            <p>✅ ATS Compatibility Score</p>
            <p>✅ Skill Gap Detection</p>
            <p>✅ AI Resume Suggestions</p>
            <p>✅ Recruiter-Friendly Feedback</p>
        </div>

        <form id="resumeForm" action="/upload" method="POST" enctype="multipart/form-data">

    <input
        type="file"
        name="resume"
        accept=".pdf,.doc,.docx"
        required>

    <br><br>


    <label for="jobRole"><strong>Select a Job Role (Optional)</strong></label>

        <select id="jobRole">
        <option value="">-- Choose a Job Role --</option>
        <option value="AI Engineer">AI Engineer</option>
        <option value="Data Scientist">Data Scientist</option>
        <option value="Machine Learning Engineer">Machine Learning Engineer</option>
        <option value="Software Engineer">Software Engineer</option>
        <option value="Frontend Developer">Frontend Developer</option>
        <option value="Backend Developer">Backend Developer</option>
        <option value="Full Stack Developer">Full Stack Developer</option>
    </select>

    <textarea
        name="job_description"
        id="job_description"
        placeholder="Paste Job Description Here..."
        rows="8"
        required>
    </textarea>

    <br><br>
    <button type="submit">
        🚀 Analyze My Resume
    </button>

    

</form>


    </div>

</div>

<div id="loadingScreen" class="loading-screen">

    <div class="loader"></div>

    <h2>🤖 AI Resume Analyzer</h2>

    <p>Analyzing your resume...</p>

</div>
<script>

const jobDescriptions = {
    "AI Engineer": `We are looking for an AI Engineer with experience in Python, Machine Learning, Deep Learning, TensorFlow, PyTorch, NLP, SQL, Git, problem-solving, and teamwork.`,

    "Data Scientist": `We are looking for a Data Scientist with knowledge of Python, SQL, Statistics, Machine Learning, Data Visualization, Pandas, NumPy, and analytical thinking.`,

    "Machine Learning Engineer": `We are looking for a Machine Learning Engineer with experience in Python, Scikit-learn, TensorFlow, Feature Engineering, Model Deployment, APIs, Git, and cloud platforms.`,

    "Software Engineer": `We are looking for a Software Engineer with strong knowledge of Data Structures, Algorithms, OOP, Python or Java, SQL, Git, problem-solving, and teamwork.`,

    "Frontend Developer": `We are looking for a Frontend Developer skilled in HTML, CSS, JavaScript, React, Responsive Design, Git, and UI/UX principles.`,

    "Backend Developer": `We are looking for a Backend Developer experienced in Python or Java, Flask or Spring Boot, REST APIs, SQL, Git, authentication, and database design.`,

    "Full Stack Developer": `We are looking for a Full Stack Developer with experience in HTML, CSS, JavaScript, React, Flask, SQL, REST APIs, Git, and problem-solving.`
};

document.getElementById("jobRole").addEventListener("change", function () {const role = this.value;const textarea = document.getElementById("job_description");
document.getElementById("resumeForm").addEventListener("submit", function (e) {

    e.preventDefault();

    document.getElementById("loadingScreen").style.display = "flex";

    setTimeout(() => {
        document.getElementById("resumeForm").submit();
    }, 100);

});
    if (jobDescriptions[role]) {
        textarea.value = jobDescriptions[role];
    }
});

</script>

</body>
</html>
