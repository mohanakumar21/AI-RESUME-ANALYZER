<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔐 Login</h1>
        {% if error %}
    <p style="color:red; font-weight:bold;">
        {{ error }}
    </p>
    {% endif %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

        <br>

        <a href="/register">
            Create New Account
        </a>

    </div>

</div>

</body>

</html>
