{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Edit Profile</h1>

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                value="{{ current_user.username }}"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                value="{{ current_user.email }}"
                required
            >

            <button type="submit">

                Save Changes

            </button>

        </form>

    </div>

</div>

{% endblock %}
