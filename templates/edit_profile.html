{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}
{% block head %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/profile.css') }}">
{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Edit Profile</h1>

        <form method="POST" class="edit-profile-form">

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ current_user.username }}"
                required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
            id="email"
            name="email"
            value="{{ current_user.email }}"
            required>
        </div>

        <button type="submit" class="profile-btn">
            💾 Save Changes
        </button>

        </form>

    </div>

</div>

{% endblock %}
