{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>🔒 Change Password</h1>

        <form method="POST">

            <label>Current Password</label>

            <input
                type="password"
                name="current_password"
                required
            >

            <label>New Password</label>

            <input
                type="password"
                name="new_password"
                required
            >

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                required
            >

            <button type="submit">

                Update Password

            </button>

        </form>

    </div>

</div>

{% endblock %}
