<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>📝 Register</h1>

        {% if error %}
<p style="color:red; font-weight:bold;">
    {{ error }}
</p>
{% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <br><br>

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <br><br>

            <button type="submit">
                Register
            </button>

        </form>

        <br>

        <a href="/login">
            Already have an account?
        </a>

    </div>

</div>

</body>

</html>
